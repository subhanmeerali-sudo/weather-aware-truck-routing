# one-click deploy on Render (render.com -> New -> Blueprint -> pick this repo)
services:
  - type: web
    name: weather-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: NOMINATIM_USER_AGENT
        value: "SpotterWeatherTruckRouting/1.0 (set-your-email@example.com)"
